<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Elkoll Dashboard</title>

<style>

:root{
    --bg:#f4f6f9;
    --card:#ffffff;
    --text:#1f2937;
    --blue:#2563eb;
    --green:#059669;
    --orange:#ea580c;
    --border:#e5e7eb;
}

body{
    margin:0;
    padding:20px;
    background:var(--bg);
    font-family:Segoe UI, Arial, sans-serif;
    color:var(--text);
}

.container{
    max-width:1400px;
    margin:auto;
}

h1{
    margin-bottom:20px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:16px;
    margin-bottom:20px;
}

.card{
    background:var(--card);
    border-radius:12px;
    padding:20px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.metric{
    font-size:2rem;
    font-weight:bold;
}

.blue{
    color:var(--blue);
}

.green{
    color:var(--green);
}

.orange{
    color:var(--orange);
}

canvas{
    width:100%;
    max-width:100%;
    margin-top:10px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#f9fafb;
}

th,td{
    padding:10px;
    border-bottom:1px solid var(--border);
    text-align:right;
}

th:first-child,
td:first-child{
    text-align:left;
}

button{
    background:var(--blue);
    color:white;
    border:none;
    padding:10px 16px;
    border-radius:8px;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

input{
    padding:8px;
    width:100%;
    box-sizing:border-box;
}

.progress{
    background:#e5e7eb;
    height:24px;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    background:var(--green);
    width:72%;
}

</style>
</head>

<body>

<div class="container">

<h1>⚡ Elkoll Dashboard</h1>

<div class="grid">

<div class="card">
    <h3>Förbrukning i år</h3>
    <div id="usageYear" class="metric blue">20 704</div>
    <div>kWh</div>
</div>

<div class="card">
    <h3>Årets kostnad</h3>
    <div id="yearCost" class="metric green">47 000</div>
    <div>kr</div>
</div>

<div class="card">
    <h3>Månadskostnad</h3>
    <div id="monthCost" class="metric orange">3 405</div>
    <div>kr</div>
</div>

<div class="card">
    <h3>Verkligt pris</h3>
    <div id="realPrice" class="metric blue">2,27</div>
    <div>kr/kWh</div>
</div>

</div>

<div class="grid">

<div class="card">
    <h2>Förbrukning per månad</h2>
    <canvas id="usageChart" width="900" height="300"></canvas>
</div>

<div class="card">
    <h2>Kostnadsfördelning</h2>
    <canvas id="costChart" width="400" height="300"></canvas>
</div>

</div>

<br>

<div class="card">

<h2>Budgetuppföljning</h2>

<p>
Prognos: <strong>47 000 kr</strong><br>
Budget: <strong>50 000 kr</strong>
</p>

<div class="progress">
    <div class="progress-bar"></div>
</div>

</div>

<br>

<div class="card">

<h2>Månadsdata</h2>

<table id="dataTable">

<thead>
<tr>
<th>Månad</th>
<th>Förbrukning (kWh)</th>
<th>Kostnad (kr)</th>
</tr>
</thead>

<tbody></tbody>

</table>

</div>

</div>

<script>

/*
   Exempeldata.
   Kan senare ersättas med JSON från fil eller API.
*/

const data = [
 {month:"Jan", usage:3683},
 {month:"Feb", usage:3207},
 {month:"Mar", usage:2723},
 {month:"Apr", usage:2017},
 {month:"Maj", usage:1062},
 {month:"Jun", usage:548},
 {month:"Jul", usage:563},
 {month:"Aug", usage:520},
 {month:"Sep", usage:601},
 {month:"Okt", usage:1501},
 {month:"Nov", usage:744},
 {month:"Dec", usage:0}
];

const pricePerKwh = 2.27;

/* ---------- TABELL ---------- */

const tbody = document.querySelector("tbody");

data.forEach(item => {

    const cost = item.usage * pricePerKwh;

    tbody.innerHTML += `
    <tr>
        <td>${item.month}</td>
        <td>${item.usage.toLocaleString("sv-SE")}</td>
        <td>${Math.round(cost).toLocaleString("sv-SE")}</td>
    </tr>`;
});

/* ---------- LINJEDIAGRAM ---------- */

const chart = document.getElementById("usageChart");
const ctx = chart.getContext("2d");

const maxValue =
Math.max(...data.map(x => x.usage));

const width = chart.width;
const height = chart.height;
const padding = 40;

ctx.clearRect(0,0,width,height);

ctx.beginPath();
ctx.strokeStyle="#d1d5db";

ctx.moveTo(padding,padding);

ctx.lineTo(
padding,
height-padding
);

ctx.lineTo(
width-padding,
height-padding
);

ctx.stroke();

ctx.beginPath();
ctx.strokeStyle="#2563eb";
ctx.lineWidth=3;

data.forEach((item,index)=>{

    const x =
    padding +
    index *
    ((width-padding*2)/(data.length-1));

    const y =
    height-padding -
    (item.usage/maxValue)*
    (height-padding*2);

    if(index===0){
        ctx.moveTo(x,y);
    }else{
        ctx.lineTo(x,y);
    }

    ctx.fillStyle="#2563eb";
    ctx.beginPath();
    ctx.arc(x,y,4,0,Math.PI*2);
    ctx.fill();

});

ctx.stroke();

data.forEach((item,index)=>{

    const x =
    padding +
    index *
    ((width-padding*2)/(data.length-1));

    ctx.fillStyle="#333";

    ctx.fillText(
        item.month,
        x-10,
        height-padding+20
    );

});

/* ---------- KOSTNADSCIRKEL ---------- */

const pie = document.getElementById("costChart");
const pctx = pie.getContext("2d");

const values = [1815,1050,540];
const colors = [
    "#2563eb",
    "#059669",
    "#ea580c"
];

const total =
values.reduce((a,b)=>a+b,0);

let start = 0;

values.forEach((v,i)=>{

    const angle =
    (v/total)*Math.PI*2;

    pctx.beginPath();

    pctx.moveTo(200,150);

    pctx.arc(
        200,
        150,
        120,
        start,
        start+angle
    );

    pctx.fillStyle =
        colors[i];

    pctx.fill();

    start += angle;
});

pctx.fillStyle="#111";
pctx.fillText("Elhandel",20,20);
pctx.fillStyle="#2563eb";
pctx.fillRect(90,10,15,15);

pctx.fillStyle="#111";
pctx.fillText("Elnät",20,45);
pctx.fillStyle="#059669";
pctx.fillRect(90,35,15,15);

pctx.fillStyle="#111";
pctx.fillText("Skatt",20,70);
pctx.fillStyle="#ea580c";
pctx.fillRect(90,60,15,15);

/* ---------- FRAMTIDA JSON ---------- */

async function loadJson(url){

    const response = await fetch(url);
    const json = await response.json();

    console.log(json);

    // Ersätt exempeldata
    // och uppdatera dashboard

}

</script>

</body>
</html>
