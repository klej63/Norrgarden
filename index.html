<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Elkoll SE3</title>

<style>

:root{
 --bg:#f5f7fa;
 --card:#ffffff;
 --border:#e5e7eb;
 --text:#1f2937;
 --blue:#2563eb;
 --green:#059669;
 --orange:#ea580c;
}

*{
 box-sizing:border-box;
}

body{
 margin:0;
 font-family:Segoe UI,Arial,sans-serif;
 background:var(--bg);
 color:var(--text);
}

.container{
 max-width:1400px;
 margin:auto;
 padding:20px;
}

h1{
 margin-top:0;
}

.grid{
 display:grid;
 grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
 gap:16px;
}

.card{
 background:var(--card);
 border-radius:12px;
 padding:20px;
 box-shadow:0 2px 8px rgba(0,0,0,.08);
 margin-bottom:16px;
}

.metric{
 font-size:2rem;
 font-weight:bold;
}

.blue{color:var(--blue);}
.green{color:var(--green);}
.orange{color:var(--orange);}

input[type=file]{
 width:100%;
 padding:10px;
}

canvas{
 width:100%;
 max-width:100%;
}

table{
 width:100%;
 border-collapse:collapse;
}

th,td{
 padding:10px;
 border-bottom:1px solid var(--border);
}

th{
 background:#f9fafb;
}

td:nth-child(2),
td:nth-child(3){
 text-align:right;
}

.progress{
 background:#e5e7eb;
 border-radius:20px;
 overflow:hidden;
 height:24px;
}

.progress-bar{
 background:#059669;
 height:100%;
 width:0%;
 transition:0.5s;
}

.small{
 color:#6b7280;
 font-size:0.9rem;
}

</style>
</head>

<body>

<div class="container">

<h1>⚡ Elkoll SE3</h1>

<div class="card">

<h2>Importera förbrukningsfil</h2>

<input
 type="file"
 id="jsonFile"
 accept=".json">

<p id="status" class="small">
Ingen fil importerad
</p>

</div>

<div class="grid">

<div class="card">
<h3>Årsförbrukning</h3>
<div id="annualUsage" class="metric blue">
20 704
</div>
<div>kWh</div>
</div>

<div class="card">
<h3>Årskostnad</h3>
<div id="annualCost" class="metric green">
47 000
</div>
<div>kr</div>
</div>
